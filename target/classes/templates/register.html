<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация компании</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card bg-light text-dark p-4 shadow">
            <h3 class="text-center mb-4">Регистрация в Space Delivery</h3>

            <form th:action="@{/users/register}" th:method="post" th:object="${userRegistrationDto}">

                <div class="mb-3">
                    <label class="form-label">Логин компании</label>
                    <input th:field="*{username}" type="text" class="form-control" th:errorclass="'is-invalid'">
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Полное название (или ФИО представителя)</label>
                    <input th:field="*{fullname}" type="text" class="form-control" th:errorclass="'is-invalid'">
                    <div th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}" class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input th:field="*{email}" type="email" class="form-control" th:errorclass="'is-invalid'">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Возраст (лет на рынке)</label>
                    <input th:field="*{age}" type="number" class="form-control" th:errorclass="'is-invalid'">
                    <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="invalid-feedback"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Пароль</label>
                        <input th:field="*{password}" type="password" class="form-control" th:errorclass="'is-invalid'">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Подтвердите пароль</label>
                        <input th:field="*{confirmPassword}" type="password" class="form-control" th:errorclass="'is-invalid'">
                    </div>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback d-block"></div>
                </div>

                <button type="submit" class="btn btn-success w-100 mt-3">Зарегистрироваться</button>
            </form>

            <div class="mt-3 text-center">
                <small>Уже есть аккаунт? <a th:href="@{/users/login}">Войти</a></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
