<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оформление миссии - Space Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #212529;
            color: white;
        }

        .navbar {
            background-color: #000 !important;
            border-bottom: 1px solid #333;
        }

        /* ИСПРАВЛЕНО: Карточка теперь имеет нормальный отступ сверху */
        .order-card {
            background-color: #121212;
            border: 1px solid #444;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 600px;
            margin-top: 2rem; /* Оптимальный отступ от Navbar */
            margin-bottom: 2rem;
        }

        .custom-input, .custom-select {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border: 1px solid #444 !important;
            border-radius: 10px !important;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder { color: #aaaaaa !important; }

        input:-webkit-autofill {
            -webkit-text-fill-color: white !important;
            -webkit-box-shadow: 0 0 0px 1000px #1e1e1e inset !important;
        }

        .form-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .section-title {
            color: #0dcaf0;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn { border-radius: 10px; padding: 12px; font-weight: bold; }

        .btn-back {
            color: #aaa !important;
            border: 1px solid #444 !important;
            background-color: transparent !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a>
    </div>
</nav>

<div class="container d-flex justify-content-center">
    <div class="p-5 order-card w-100">
        <div class="section-title">Параметры миссии</div>

        <form th:action="@{/orders/create}" th:method="post" th:object="${orderCreateDto}">
            <input type="hidden" th:field="*{rocketId}">

            <div class="mb-4">
                <label class="form-label">Название груза</label>
                <input type="text" th:field="*{cargoName}" class="form-control custom-input" placeholder="Напр: Спутник связи">
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Вес (кг)</label>
                    <input type="number" step="0.1" th:field="*{cargoWeight}" class="form-control custom-input" placeholder="0.0">
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Целевая орбита</label>
                    <select th:field="*{orbitType}" class="form-select custom-select">
                        <option value="LEO">LEO</option>
                        <option value="MEO">MEO</option>
                        <option value="GEO">GEO</option>
                        <option value="HEO">HEO</option>
                    </select>
                </div>
            </div>

            <div class="section-title mt-2">Контактная информация</div>

            <div class="mb-4">
                <label class="form-label">Телефон</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control custom-input" placeholder="+7 (___) ___-__-__">
            </div>

            <div class="mb-4">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{contactEmail}" class="form-control custom-input" placeholder="mail@example.com">
            </div>

            <div class="mt-4 pt-2">
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow">Подтвердить миссию</button>
                <a href="/rockets" class="btn btn-back w-100 mt-2">Вернуться назад</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
