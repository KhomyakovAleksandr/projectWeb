<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4 border-0">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Личный кабинет</h2>
            <span th:if="${isModerator}" class="badge bg-warning text-dark fs-6">Статус: МОДЕРАТОР</span>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-8">
                <p><strong>Логин:</strong> <span th:text="${user.username}">user</span></p>
                <p><strong>Полное имя:</strong> <span th:text="${user.fullName}">Иванов Иван</span></p>
                <p><strong>Email:</strong> <span th:text="${user.email}">mail@example.com</span></p>
                <p><strong>Возраст:</strong> <span th:text="${user.age}">25</span></p>
            </div>

            <div class="col-md-4" th:if="${isModerator}">
                <div class="card border-warning bg-light p-3">
                    <h6>Панель модератора</h6>
                    <a href="/rockets/add" class="btn btn-sm btn-success mb-2">Добавить ракету</a>
                    <a href="/orders/manage" class="btn btn-sm btn-outline-dark">Заказы системы</a>
                </div>
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <a href="/" class="btn btn-outline-secondary">На главную</a>
            <form th:action="@{/users/logout}" th:method="post">
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
