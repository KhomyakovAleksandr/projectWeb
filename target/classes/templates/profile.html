<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Space Delivery - Профиль</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
    <div class="container">
        <a class="navbar-brand" href="/">🚀 Space Delivery</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/rockets">РАКЕТЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link text-white" href="/orders">ЗАКАЗЫ</a>
            <a class="nav-link text-success fw-bold" href="/users/profile">МОЙ ПРОФИЛЬ</a>
        </div>
    </div>
</nav>

<div class="container mt-5 text-center">
    <div class="py-5 mx-auto" style="max-width: 500px;">
        <h2 class="display-5 mb-4">Данные аккаунта</h2>
        <div class="text-start p-4 rounded bg-black border border-secondary">
            <p><strong>Логин:</strong> <span th:text="${user.username}">...</span></p>
            <p><strong>ФИО:</strong> <span th:text="${user.fullName}">...</span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}">...</span></p>
            <p><strong>Возраст:</strong> <span th:text="${user.age}">...</span></p>
            <hr class="bg-secondary">
            <form th:action="@{/users/logout}" method="post">
                <button type="submit" class="btn btn-danger w-100 mt-2">Выйти из аккаунта</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
