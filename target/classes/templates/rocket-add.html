<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить ракету</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow mb-5 border-bottom border-secondary">
    <div class="container"><a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a></div>
</nav>

<div class="container">
    <div class="mx-auto p-4 rounded border border-secondary bg-black" style="max-width: 600px;">
        <h3 class="mb-4 text-success">Новый носитель</h3>

        <form th:action="@{/rockets/add}" th:method="post" th:object="${rocketAddDto}">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" th:field="*{name}" class="form-control bg-dark text-white border-secondary">
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea th:field="*{description}" class="form-control bg-dark text-white border-secondary" rows="3"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Цена ($)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control bg-dark text-white border-secondary">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Грузоподъемность (кг)</label>
                    <input type="number" step="0.1" th:field="*{payloadCapacity}" class="form-control bg-dark text-white border-secondary">
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3">Сохранить в реестр</button>
            <a href="/rockets" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
