<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Список заказов - Space Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #212529;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #000 !important;
            border-bottom: 1px solid #333;
        }
        .nav-link {
            color: #fff !important;
            font-weight: 500;
            text-transform: uppercase;
        }

        .orders-wrapper {
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .table { color: white !important; margin-bottom: 0; border-color: #444; }
        .table thead th {
            background-color: #1e1e1e !important;
            color: #888 !important;
            border-bottom: 2px solid #444;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .table td {
            background-color: #1e1e1e !important;
            border-bottom: 1px solid #333;
            padding: 15px 10px;
        }
        .table tr:hover td { background-color: #252525 !important; }

        .client-name { color: #ccc !important; font-weight: 500; }
        .cargo-title { color: #ffffff !important; font-weight: 600; }
        .cargo-info { color: #aaaaaa !important; }

        .status-select {
            background-color: #121212 !important;
            color: #ffffff !important;
            border: 1px solid #444 !important;
            border-radius: 8px;
        }

        .badge-status { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; }
        .badge-pending { background-color: #444; }
        .badge-approved { background-color: #0d6efd; }
        .badge-assembling { background-color: #fd7e14; }
        .badge-inflight { background-color: #6610f2; }
        .badge-completed { background-color: #198754; }
        .badge-canceled { background-color: #dc3545; }

        .footer-simple {
            margin-top: auto;
            padding: 50px 0 30px 0;
            text-align: center;
        }
        .support-text {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
        }
        .support-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            margin-left: 20px;
            opacity: 0.8;
            transition: 0.3s;
        }
        .support-link:hover {
            opacity: 1;
            color: #0dcaf0;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link px-3" href="/rockets">РАКЕТЫ</a>
            <a class="nav-link px-3 active" href="/orders">ЗАКАЗЫ</a>
            <a class="nav-link px-3" href="/users/profile">МОЙ ПРОФИЛЬ</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <h2 class="mb-4 fw-bold" th:text="${#authorization.expression('hasRole(''MODERATOR'')') ? 'Центр управления полетами' : 'Мои заказы'}">Заказы</h2>

    <div class="orders-wrapper">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Ракета</th>
                    <th sec:authorize="hasRole('MODERATOR')">Клиент</th>
                    <th>Груз / Орбита</th>
                    <th sec:authorize="hasRole('MODERATOR')">Контакты</th>
                    <th>Дата создания</th>
                    <th>Статус</th>
                    <th sec:authorize="hasRole('MODERATOR')">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td class="text-secondary" th:text="'#' + ${order.id}">#1</td>
                    <td class="fw-bold text-info" th:text="${order.rocket.name}">Falcon 9</td>

                    <td sec:authorize="hasRole('MODERATOR')" class="client-name" th:text="${order.user.username}">user123</td>

                    <td>
                        <div class="cargo-title" th:text="${order.cargoName}">Спутник</div>
                        <small class="cargo-info" th:text="${order.cargoWeight} + 'кг | ' + ${order.orbitType}">100кг | LEO</small>
                    </td>

                    <td sec:authorize="hasRole('MODERATOR')">
                        <div style="color: #0dcaf0; font-size: 0.9rem;" th:text="${order.phoneNumber}">+7 (000) 000-00-00</div>
                        <div style="color: #888; font-size: 0.8rem;" th:text="${order.contactEmail}">user@mail.ru</div>
                    </td>

                    <td class="text-secondary" th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>

                    <td>
                        <span sec:authorize="hasRole('USER')"
                              class="badge badge-status"
                              th:classappend="'badge-' + ${order.status.name().toLowerCase()}"
                              th:text="${order.status}">PENDING</span>

                        <form sec:authorize="hasRole('MODERATOR')" th:action="@{/orders/status/{id}(id=${order.id})}" th:method="post" class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm status-select">
                                <option th:each="st : ${T(ru.rutmiit.models.enums.OrderStatus).values()}"
                                        th:value="${st}" th:text="${st}" th:selected="${st == order.status}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary px-3">OK</button>
                        </form>
                    </td>

                    <td sec:authorize="hasRole('MODERATOR')">
                        <form th:action="@{/orders/delete/{id}(id=${order.id})}" th:method="post"
                              onsubmit="return confirm('Вы уверены, что хотите безвозвратно удалить этот заказ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td th:colspan="${#authorization.expression('hasRole(''MODERATOR'')') ? 8 : 5}" class="text-center py-5 text-secondary">Список заказов пуст</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="footer-simple" sec:authorize="hasRole('USER')">
    <div class="container">
        <span class="support-text">Поддержка:</span>
        <a href="tel:+79991234567" class="support-link">+7 (999) 123-45-67</a>
        <a href="mailto:space.delivery.support@mail.ru" class="support-link">space.delivery.support@mail.ru</a>
    </div>
</footer>

</body>
</html>
