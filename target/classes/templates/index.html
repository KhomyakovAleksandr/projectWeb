<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Space Delivery - Главная</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #121212; }
        .navbar { background-color: #000 !important; border-bottom: 1px solid #333; }
        .nav-link { color: #fff !important; font-weight: 500; transition: 0.3s; }
        .nav-link:hover { color: #0d6efd !important; }
    </style>
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link px-3" href="/rockets">РАКЕТЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link px-3" href="/orders">ЗАКАЗЫ</a>
            <a sec:authorize="isAnonymous()" class="nav-link px-3 text-primary" href="/users/login">ВОЙТИ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link px-3 text-success" href="/users/profile">МОЙ ПРОФИЛЬ</a>
        </div>
    </div>
</nav>

<div class="container text-center mt-5">
    <div class="py-5">
        <h1 class="display-4 fw-bold">Доставка грузов на орбиту</h1>
        <p class="lead text-secondary">Выбирайте ракету, загружайте паллеты и отправляйте в космос за пару кликов.</p>
        <hr class="my-4 border-secondary" style="width: 50%; margin: auto;">
    </div>
</div>

</body>
</html>
