<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card bg-light text-dark p-4 shadow">
            <h3 class="text-center mb-4">Space Delivery</h3>

            <div th:if="${badCredentials}" class="alert alert-danger">
                Неверный логин или пароль!
            </div>

            <form th:action="@{/users/login}" th:method="post">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-control"
                           th:value="${username}" required placeholder="Введите логин">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <div class="mt-3 text-center">
                <small>Нет аккаунта? <a th:href="@{/users/register}">Зарегистрироваться</a></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
