<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - Space Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #212529; color: white; }

        .auth-card {
            background-color: #121212;
            border: 1px solid #444;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin-top: 100px;
        }

        .custom-input {
            background-color: #1e1e1e !important;
            color: white !important;
            border: 1px solid #444 !important;
            border-radius: 10px !important;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder { color: #777 !important; }

        .custom-input:focus {
            border-color: #0d6efd !important;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.2) !important;
            outline: none !important;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-text-fill-color: white !important;
            -webkit-box-shadow: 0 0 0px 1000px #1e1e1e inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .form-label { color: #ccc; font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary { background-color: #0d6efd; border: none; border-radius: 10px; padding: 12px; font-weight: bold; }
        .link-info { text-decoration: none; color: #0dcaf0; transition: 0.3s; }
        .link-info:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4 auth-card p-5">
            <h2 class="text-center fw-bold mb-4">🚀 Space Delivery</h2>
            <p class="text-center text-secondary small mb-4">Вход в систему управления</p>

            <div th:if="${badCredentials}" class="alert alert-danger border-0 bg-danger text-white py-2 small text-center">
                Неверный логин или пароль!
            </div>

            <form th:action="@{/users/login}" th:method="post">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control custom-input"
                           th:value="${username}" required placeholder="Введите ваш логин">
                </div>
                <div class="mb-4">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control custom-input" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти в реестр</button>
            </form>

            <div class="mt-4 text-center">
                <span class="text-secondary small">Нет аккаунта?</span>
                <a th:href="@{/users/register}" class="link-info small">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
