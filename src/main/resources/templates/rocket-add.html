<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить ракету - Space Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #1a1d20;
        }

        .navbar {
            background-color: #000 !important;
            border-bottom: 1px solid #333;
        }

        .form-card {
            background-color: #121212;
            border: 1px solid #444;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .custom-input {
            background-color: #1e1e1e !important;
            color: white !important;
            border: 1px solid #444 !important;
            border-radius: 10px !important;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder {
            color: #aaa !important;
            opacity: 1;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus {
            -webkit-text-fill-color: white !important;
            -webkit-box-shadow: 0 0 0px 1000px #1e1e1e inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .custom-input:focus {
            background-color: #252525 !important;
            border-color: #0d6efd !important;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.2) !important;
            outline: none !important;
        }

        .form-label {
            color: #ccc;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .btn {
            border-radius: 10px;
            padding: 12px;
        }
    </style>
</head>
<body class="text-white">

<nav class="navbar navbar-expand-lg navbar-dark shadow mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="mx-auto p-5 form-card" style="max-width: 650px;">
        <h2 class="mb-4 fw-bold text-success text-center">Новый носитель</h2>
        <hr class="border-secondary mb-4">

        <form th:action="@{/rockets/add}" th:method="post" th:object="${rocketAddDto}">
            <div class="mb-4">
                <label class="form-label">Название ракеты</label>
                <input type="text" th:field="*{name}" class="form-control custom-input" placeholder="Напр: Falcon Heavy">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Описание миссии</label>
                <textarea th:field="*{description}" class="form-control custom-input" rows="4" placeholder="Опишите возможности ракеты и её назначение..."></textarea>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Стоимость пуска ($/kg)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control custom-input" placeholder="Например: 62000000">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Грузоподъемность (кг)</label>
                    <input type="number" step="0.1" th:field="*{payloadCapacity}" class="form-control custom-input" placeholder="Например: 22800">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('payloadCapacity')}" th:errors="*{payloadCapacity}"></div>
                </div>
            </div>

            <div class="pt-3">
                <button type="submit" class="btn btn-success w-100 fw-bold">Зарегистрировать ракету</button>
                <a href="/rockets" class="btn btn-outline-secondary w-100 mt-3 border-0">Вернуться в каталог</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
