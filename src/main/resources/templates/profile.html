<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Space Delivery - Профиль</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #212529; }

        .navbar { background-color: #000 !important; border-bottom: 1px solid #333; }
        .nav-link { color: #fff !important; font-weight: 500; text-transform: uppercase; transition: 0.3s; }
        .nav-link:hover { opacity: 0.7; }

        .profile-card {
            background-color: #121212;
            border: 1px solid #444;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .info-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            display: block;
        }

        .btn { border-radius: 10px; padding: 12px; transition: 0.3s; }

        .btn-logout {
            border: 1px solid #dc3545 !important;
            color: #dc3545 !important;
            background-color: transparent !important;
        }
        .btn-logout:hover {
            background-color: #dc3545 !important;
            color: white !important;
        }
    </style>
</head>
<body class="text-white">

<nav class="navbar navbar-expand-lg navbar-dark shadow mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link px-3" href="/rockets">РАКЕТЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link px-3" href="/orders">ЗАКАЗЫ</a>
            <a class="nav-link px-3" href="/users/profile">МОЙ ПРОФИЛЬ</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="profile-card mx-auto p-5" style="max-width: 550px;">
        <div class="text-center mb-5">
            <div class="display-3 mb-3">👤</div>
            <h2 class="fw-bold">Данные аккаунта</h2>
            <p class="text-secondary small">Управление личной информацией</p>
        </div>

        <div class="row text-start px-3">
            <div class="col-12">
                <div class="info-label">Логин</div>
                <div class="info-value" th:text="${user.username}">...</div>

                <div class="info-label">Название компании/ФИО</div>
                <div class="info-value" th:text="${user.fullName}">...</div>

                <div class="info-label">Email</div>
                <div class="info-value" th:text="${user.email}">...</div>

                <div class="info-label">
                    <span sec:authorize="hasRole('MODERATOR')">Возраст</span>
                    <span sec:authorize="hasRole('USER')">Возраст компании</span>
                </div>
                <div class="info-value" th:text="${user.age}">...</div>
            </div>
        </div>

        <div class="mt-4 px-3">
            <form th:action="@{/users/logout}" method="post">
                <button type="submit" class="btn btn-logout w-100 fw-bold">Выйти из аккаунта</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
