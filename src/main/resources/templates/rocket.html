<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Space Delivery - Ракеты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
    <div class="container">
        <a class="navbar-brand" href="/">🚀 Space Delivery</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active text-white" href="/rockets">РАКЕТЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link text-white" href="/orders">ЗАКАЗЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link text-success" href="/users/profile">МОЙ ПРОФИЛЬ</a>
            <a sec:authorize="isAnonymous()" class="nav-link text-primary" href="/users/login">ВОЙТИ</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <h2 class="display-6">Доступные носители</h2>
            <a href="/rockets/add" sec:authorize="hasRole('MODERATOR')" class="btn btn-outline-success btn-sm">+ Добавить ракету</a>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="rocket : ${rockets}">
                <div class="card bg-black border-secondary h-100 text-white shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${rocket.name}">Название</h5>
                        <p class="card-text text-secondary small" th:text="${rocket.description}">Описание</p>
                        <div class="mt-auto pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-info" th:text="${#numbers.formatCurrency(rocket.price)}">Цена</span>
                            <button class="btn btn-primary btn-sm">Заказать</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
