<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Space Delivery - Ракеты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #121212; }
        .navbar { background-color: #000 !important; border-bottom: 1px solid #333; }
        .nav-link { color: #fff !important; font-weight: 500; }

        /* КАРТОЧКИ: Светлая обводка #444 и закругление 15px */
        .rocket-card {
            background: #1e1e1e;
            border: 1px solid #444; /* Сделали светлее */
            border-radius: 15px;
            transition: 0.3s;
        }
        .rocket-card:hover {
            border-color: #0d6efd;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* ПОИСК: Светлая обводка и тот же цвет фона */
        .search-input {
            background-color: #1e1e1e !important;
            color: white !important;
            border: 1px solid #444 !important; /* Сделали светлее */
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .search-input::placeholder {
            color: #777 !important;
        }
        .search-input:focus {
            background-color: #252525 !important;
            border-color: #0d6efd !important;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.2) !important;
            outline: none !important;
        }

        .btn { border-radius: 10px; }
    </style>
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark shadow mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link px-3 active text-info" href="/rockets">РАКЕТЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link px-3" href="/orders">ЗАКАЗЫ</a>
            <a sec:authorize="isAuthenticated()" class="nav-link px-3 text-success" href="/users/profile">МОЙ ПРОФИЛЬ</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Каталог носителей</h2>
        <a href="/rockets/add" sec:authorize="hasRole('MODERATOR')" class="btn btn-success">+ Добавить ракету</a>
    </div>

    <div class="row mb-5">
        <div class="col-md-6">
            <form th:action="@{/rockets}" method="get" class="d-flex gap-2">
                <input type="text" name="keyword" th:value="${keyword}"
                       class="form-control search-input"
                       placeholder="Поиск по названию ракеты..." aria-label="Search">
                <button class="btn btn-primary px-4" type="submit">Найти</button>
                <a th:href="@{/rockets}" class="btn btn-outline-secondary" th:if="${keyword != null and keyword != ''}">Сброс</a>
            </form>
            <div class="mt-2 small text-secondary" th:if="${keyword != null and keyword != ''}">
                Результаты поиска для: <span class="text-info" th:text="${keyword}"></span>
            </div>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col" th:each="rocket : ${rockets}">
            <div class="card rocket-card h-100 text-white p-3">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-info" th:text="${rocket.name}">Falcon 9</h5>
                    <p class="card-text text-secondary small" th:text="${#strings.abbreviate(rocket.description, 150)}">Описание...</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-bold" th:text="${rocket.price} + ' $/kg'">62M $</span>
                        <a th:href="@{/rockets/details/{id}(id=${rocket.id})}" class="btn btn-sm btn-outline-primary px-3">Подробнее</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(rockets)}">
            <h4 class="text-secondary">Ракеты по вашему запросу не найдены 🚀</h4>
            <a th:href="@{/rockets}" class="text-info text-decoration-none">Показать все ракеты</a>
        </div>
    </div>
</div>

</body>
</html>
