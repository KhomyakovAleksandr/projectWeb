<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Детали ракеты - Space Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow mb-5 border-bottom border-secondary">
    <div class="container"><a class="navbar-brand fw-bold" href="/">🚀 Space Delivery</a></div>
</nav>

<div class="container">
    <div class="p-5 rounded border border-secondary bg-black shadow-lg">
        <h1 class="display-4 text-info" th:text="${rocket.name}">Falcon 9</h1>
        <hr class="bg-secondary">
        <div class="row mt-4">
            <div class="col-md-8">
                <h4>Описание миссии</h4>
                <p class="lead text-secondary" th:text="${rocket.description}">Тут длинный текст...</p>
            </div>
            <div class="col-md-4 border-start border-secondary ps-4">
                <h5>Характеристики:</h5>
                <p>💰 Цена: <span class="text-white" th:text="${rocket.price} + ' $'">0 $</span></p>
                <p>⚖️ Грузоподъемность: <span class="text-white" th:text="${rocket.payloadCapacity} + ' кг'">0 кг</span></p>

                <button class="btn btn-primary btn-lg w-100 mt-4" sec:authorize="hasRole('USER')">Забронировать пуск</button>

                <div sec:authorize="hasRole('MODERATOR')" class="mt-3 text-center text-warning small">
                    Режим просмотра (админ)
                </div>
            </div>
        </div>
        <a href="/rockets" class="btn btn-outline-light mt-5">← Вернуться в каталог</a>
    </div>
</div>
</body>
</html>
